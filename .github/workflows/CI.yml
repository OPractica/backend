name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Lint
        run: uv run --only-group dev ruff check .

      - name: Check formatting
        run: uv run --only-group dev ruff format --check .
