services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: booking, POSTGRES_PASSWORD: booking, POSTGRES_DB: booking}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U booking"], interval: 3s, retries: 20}
  mailpit:            # catches all outgoing mail in dev: http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025"]
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
