<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workplace Booking</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f6;--card:#fff;--ink:#111;--muted:#6b7684;--line:#e4e4e4;--accent:#f26b0f;--seat:#e5484d;--plant:#3a9d3a;--dash:#8a8a8a;--btn:#c8c8c8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1318;--card:#171f27;--ink:#eef2f6;--muted:#93a0ae;--line:#2a3643;--dash:#6b7684;--btn:#3a4552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1318;--card:#171f27;--ink:#eef2f6;--muted:#93a0ae;--line:#2a3643;--dash:#6b7684;--btn:#3a4552;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.bp{display:flex;min-height:100%;border-top:3px solid #000;box-sizing:border-box}
.sb{width:52px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;box-sizing:border-box;flex:none}
.sb button{position:relative;width:44px;height:40px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;border-radius:8px}
.sb button.on{color:var(--accent)}
.sb button.on:before{content:"";position:absolute;left:-4px;top:0;bottom:0;width:3px;background:var(--accent)}
.sb .sp{flex:1}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.head{height:46px;display:flex;align-items:center;padding:0 18px;font-size:19px;font-weight:700;background:var(--card);border-bottom:1px solid var(--line)}
.main{flex:1;display:grid;grid-template-columns:1fr 290px;gap:18px;padding:18px;min-height:0}
.smap{position:relative;min-height:440px;background:var(--card);border-radius:12px;overflow:hidden}
.crumbs{position:absolute;top:18px;left:22px;display:flex;flex-wrap:wrap;gap:8px;font-weight:700;z-index:1;font-size:15px}
.crumbs span:after{content:"›";margin-left:8px}
.crumbs b{color:var(--accent)}
.smap svg{width:100%;height:100%;display:block}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 2px 8px #00000038;display:grid;place-items:center;cursor:pointer}
.tr{position:absolute;top:14px;right:18px;display:flex;gap:12px}
.br{position:absolute;bottom:18px;right:18px;display:flex;gap:12px}
.bpn{background:var(--card);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:16px;font-weight:500}
.sw input{position:absolute;opacity:0}
.sw i{width:34px;height:14px;border-radius:7px;background:#ccc;position:relative;transition:background .2s}
.sw i:after{content:"";position:absolute;top:-3px;left:0;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #00000059;transition:transform .2s}
.sw input:checked+i{background:#f7b98a}
.sw input:checked+i:after{transform:translateX(16px);background:var(--accent)}
.cal{flex:1;min-height:180px}
.sel{border:1px dashed #aaa;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.5}
.sel b{color:var(--accent)}
.btn{border:0;border-radius:8px;padding:13px;font:inherit;font-weight:600;background:var(--btn);color:#fff;cursor:not-allowed;width:100%}
.btn.on{background:var(--accent);cursor:pointer}
.seat{cursor:pointer}
.seat .d{fill:var(--card);stroke:var(--seat);stroke-width:3}
.seat .p{fill:var(--ink)}
.seat .r{fill:none;stroke:transparent;stroke-width:3}
.seat:hover .d{stroke-width:5}
.seat.sel .r{stroke:var(--accent)}
.seat.sel .d{fill:var(--accent);stroke:var(--accent)}
.seat.sel .p{fill:#fff}
.l{fill:none;stroke:var(--dash);stroke-width:.9}
.z{stroke-dasharray:1.5 2.5;stroke:var(--dash)}
.pl{fill:var(--plant);font-size:11px}
.tt{fill:var(--ink);font:700 32px Georgia,"Times New Roman",serif;letter-spacing:.02em}
[hidden]{display:none!important}
.who{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.auth{position:fixed;inset:0;z-index:20;background:#000a;overflow:auto;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.ac{position:relative;background:var(--card);border-radius:12px;padding:28px 26px;width:100%;max-width:380px;display:grid;gap:12px;box-shadow:0 6px 24px #0000001a;box-sizing:border-box}
.logo{font-size:20px;font-weight:700;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.t{border:0;background:none;padding:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.t.on{color:var(--accent);border-color:var(--accent)}
.f{display:grid;gap:4px;font-size:13px;font-weight:500}
.f input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.f input:focus{outline:2px solid var(--accent);border-color:transparent}
.err{color:#d64545;font-size:13px;min-height:1em}
.or{text-align:center;color:var(--muted);font-size:13px}
.gbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.demo{margin:0;font-size:12px;color:var(--muted);text-align:center}
.na{flex:1;display:grid;place-items:center;padding:18px}
.nac{background:var(--card);border-radius:12px;padding:48px 28px;text-align:center;max-width:420px;width:100%;box-sizing:border-box}
.nac h2{margin:12px 0 6px;font-size:20px}
.nac p{margin:4px 0;color:var(--muted)}
.nai{color:var(--accent);display:grid;place-items:center}
.x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:24px;color:var(--muted);cursor:pointer}
.cb{border:1px dashed var(--accent);border-radius:8px;padding:10px;font-size:13px;text-align:center}.cb b{color:var(--accent);font-size:18px;letter-spacing:.2em}
.lg{margin-left:12px;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.out{background:none;border:1px solid #d64545;color:#d64545}
.seat.mine .d{fill:#1f9d78;stroke:#1f9d78}.seat.mine .p{fill:#fff}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:8px}.ch button{border:0;background:none;color:var(--ink);cursor:pointer;font-size:16px;padding:4px 10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px 0}.dh{font-weight:700;font-size:13px;padding-bottom:6px}
.cd{width:30px;height:30px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;font:inherit;font-size:14px;cursor:pointer;position:relative;border:0;background:none;color:var(--ink)}
.cd:disabled{color:#bbb;cursor:default}.cd.s{background:var(--accent);color:#fff;font-weight:700}
.cd.t:after{content:"";position:absolute;bottom:2px;width:4px;height:4px;background:var(--accent);border-radius:50%}.cd.s.t:after{background:#fff}
.seat.busy{cursor:not-allowed}.seat.busy .d{fill:#c7ccd4;stroke:#c7ccd4}.seat.busy .p{fill:#fff}
.lgd{position:absolute;left:22px;bottom:18px;display:flex;gap:14px;font-size:13px;z-index:1}.lgd span{display:flex;align-items:center;gap:6px}.lgd i{width:12px;height:12px;border-radius:3px;display:inline-block}
.seat .d{stroke:#1f9d78}.seat.sel .d{fill:var(--card);stroke:#1f9d78}.seat.sel .p{fill:var(--ink)}
.seat.mine .d{fill:var(--accent);stroke:var(--accent)}.seat.mine .p{fill:#fff}
.seat.busy .d{fill:#e5484d;stroke:#e5484d}.seat.busy .p{fill:#fff}
.pg{flex:1;padding:18px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.pc{background:var(--card);border-radius:12px;padding:24px;width:100%;max-width:560px;box-sizing:border-box;display:grid;gap:14px}
.pc h2{margin:0}.pc h3{margin:10px 0 0;font-size:16px}.pc p{margin:2px 0 0;color:var(--muted)}
.ph{display:flex;align-items:center;gap:14px}.av{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}.row>div{display:grid}.row span{color:var(--muted);font-size:13px}
.row select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bl{display:grid;gap:8px}.br2{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.br2>div{display:grid}.br2 span{color:var(--muted);font-size:13px}
@media (max-width:820px){.main{grid-template-columns:1fr}.smap{min-height:340px}.cal{min-height:140px}}
</style>
</head>
<body>
<div class="auth" id="auth" hidden>
  <form class="ac" id="af" novalidate>
    <button type="button" class="x" id="a-x" aria-label="Close">×</button>
    <div class="logo">Workplace Booking</div>
    <div class="tabs"><button type="button" class="t on" data-m="login">Log in</button><button type="button" class="t" data-m="reg">Register</button></div>
    <label class="f reg" hidden>Full name<input id="a-name" autocomplete="name"></label>
    <label class="f">Outlook email<input id="a-email" type="email" autocomplete="username" placeholder="name@outlook.com"></label>
    <label class="f reg" hidden>Phone number<input id="a-phone" type="tel" autocomplete="tel" placeholder="+373 600 00000"></label>
    <label class="f">Password<input id="a-pass" type="password" autocomplete="current-password"></label>
    <label class="f reg" hidden>Confirm password<input id="a-pass2" type="password" autocomplete="new-password"></label>
    <div class="err" id="a-err" role="alert"></div>
    <button class="btn on" id="a-go" type="submit">Log in</button>
    <p class="demo" id="stor"></p>
  </form>
  <div class="ac" id="cs" hidden>
    <button type="button" class="x" id="c-x" aria-label="Close">×</button>
    <div class="logo">Confirm your email</div>
    <p class="demo" id="c-msg"></p>
    <div class="cb" id="c-demo"></div>
    <label class="f">6-digit code<input id="c-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <div class="err" id="c-err" role="alert"></div>
    <button class="btn on" id="c-ok" type="button">Confirm</button>
    <button type="button" class="gbtn" id="c-re">Send a new code</button>
  </div>
</div>
<div class="bp" id="app">
  <nav class="sb" id="sb"></nav>
  <div class="col">
    <header class="head"><span id="title">Workplace Booking</span><span class="who" id="who"></span><button class="lg" id="lg">Log in</button></header>
    <main class="main" id="booking">
      <section class="smap">
        <nav class="crumbs"><span>Zity Mall</span><span>7th floor, Orange kITchen</span><b>Select Place</b></nav>
        <svg id="map" viewBox="76 74 1193 758" role="img" aria-label="Floor plan"></svg>
        <div class="lgd"><span><i style="background:#1f9d78"></i>Free</span><span><i style="background:#e5484d"></i>Booked</span><span><i style="background:var(--accent)"></i>Yours</span></div>
        <div class="tr"><button class="rb" id="i-eye" aria-label="View"></button><button class="rb" id="i-filter" aria-label="Filter"></button></div>
        <div class="br"><button class="rb" id="i-info" aria-label="Info"></button><button class="rb" id="i-search" aria-label="Reset"></button><button class="rb" id="i-minus" aria-label="Zoom out"></button><button class="rb" id="i-plus" aria-label="Zoom in"></button></div>
      </section>
      <aside class="bpn">
        <div class="top">
          <label class="sw"><input type="checkbox" role="switch"><i></i>Hourly</label>
          <span id="i-help"></span>
        </div>
        <div class="cal" id="cal" data-slot="calendar"></div>
        <div class="sel" role="status"><div>Selected <b id="seld"></b><span id="seatlbl"></span></div><div id="hint">Please, select place or another date</div></div>
        <button class="btn" id="book" disabled>Book</button>
        <div class="demo" id="note"></div>
      </aside>
    </main>
    <main class="na" id="na" hidden>
      <div class="nac"><div class="nai" id="na-i"></div><h2 id="na-t"></h2><p>This feature is temporarily unavailable.</p><p>We are working on it. Please check back later.</p></div>
    </main>
    <main class="pg" id="profile" hidden></main>
    <main class="pg" id="settings" hidden></main>
  </div>
</div>
<script>
var P={chevron:"M9 5l7 7-7 7",grid:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",desk:"M12 3.5a2.7 2.7 0 100 5.4 2.7 2.7 0 000-5.4zM7 15a5 5 0 0110 0M4 20h16M6 20v-2M18 20v-2",monitor:"M3 5h18v11H3zM8 20h8M12 16v4",user:"M12 4a4 4 0 100 8 4 4 0 000-8zM5 21c0-4 3-6 7-6s7 2 7 6",bell:"M6 17v-6a6 6 0 0112 0v6l2 2H4zM10 21h4",gear:"M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2",chat:"M4 5h16v11H10l-6 4z",logout:"M10 4H5v16h5M15 8l4 4-4 4M19 12H9",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z",filter:"M3 4h18l-7 9v6l-4 2v-8z",info:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v6M12 7.5v.5",search:"M10 3a7 7 0 100 14 7 7 0 000-14zM15 15l6 6",minus:"M5 12h14",plus:"M5 12h14M12 5v14",help:"M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17v.5"};
function ic(n,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>'}
/* seat coordinates */
function du(e,t){var o=[];for(var n=0;n<3;n++)for(var r=0;r<2;r++)o.push([e+r*14,t+n*13]);return o}
function fm(a,t){return [].concat.apply([],a.map(function(e){return du(e,t)}))}
var S=[].concat(fm([476,535,583,627,678,727,776,834],272),du(595,341),fm([495,546,604,685,725,774,835],402),
[903,924,945,966,985,1002].map(function(e){return[e,267]}),[[945,281],[1002,281]],[903,924,945,966,985].map(function(e){return[e,298]}),
[[900,410],[921,410],[944,410],[966,410],[1002,410],[1002,425],[930,427]],[895,914,933,952,972,990].map(function(e){return[e,444]}));
var R=[[357,225,70,37],[357,259,70,66],[403,259,24,43],[357,325,70,64],[357,389,70,70],[447,264,16,44],[447,332,63,56],[480,333,30,13],[466,348,44,40],[520,333,18,18],[520,367,18,18],[621,331,106,57],[730,331,12,57],[746,331,50,57],[803,331,52,57],[877,331,16,57],[944,336,70,50],[470,400,14,56]];
var Q=[[517,283],[517,303],[572,283],[572,300],[664,310],[764,310],[816,290],[816,302],[589,432],[589,444],[648,410],[759,412],[759,438],[816,430],[816,442]];
var h='<g><polygon class="l z" points="330,495 410,520 385,600 300,572"/><polygon class="l z" points="292,548 392,580 372,632 282,606"/><polygon class="l z" points="404,565 450,580 436,640 392,626"/><path class="l z" d="M231 596L500 705M231 596L140 828M493 459L500 705M498 480L430 520M94 117L183 320"/><rect class="l z" x="357" y="259" width="658" height="200"/><rect class="l z" x="463" y="114" width="89" height="69"/><rect class="l z" x="798" y="30" width="238" height="162"/>';
R.forEach(function(r){h+='<rect class="l" x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'"/>'});
h+='<circle cx="661" cy="435" r="16" fill="#fbe9a5" stroke="#e3cd7e" stroke-dasharray="2 2"/>';
Q.forEach(function(q){h+='<text class="pl" x="'+q[0]+'" y="'+q[1]+'" text-anchor="middle">✻</text>'});
h+='<text class="tt" x="502" y="243">Entry</text><text class="tt" x="543" y="503">Entry</text><text class="tt" x="866" y="517">ZTower</text></g>';
S.forEach(function(c,i){h+='<g class="seat" data-id="s'+(i+1)+'" data-l="'+(c[1]<380?'A':'B')+(i+1)+'" transform="translate('+c[0]+' '+c[1]+') scale('+(13/28)+')"><rect class="r" x="-4" y="-4" width="36" height="36" rx="8"/><rect class="d" width="28" height="28" rx="4"/><circle class="p" cx="14" cy="10.5" r="4.2"/><path class="p" d="M6 23c0-5 3.5-7 8-7s8 2 8 7z"/></g>'});
document.getElementById('map').innerHTML=h;

/* ===== helpers ===== */
function g$(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function sv(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
function p2(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function lng(k){var d=new Date(k+'T00:00:00');return DN[d.getDay()]+', '+d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()}
var OL=/^[^@\s]+@(outlook|hotmail|live|msn)\.[a-z.]{2,}$/i;
/* API store: talks to the FastAPI backend (PostgreSQL) on the same server */
var store=(function(){
  var API='/api/v1',T=ld('wb_tokens'),me=null;
  function msg(j,st){var d=j&&j.detail;if(typeof d==='string')return d;if(d&&d[0]&&d[0].msg)return d[0].msg.replace(/^Value error, /,'');return'Something went wrong ('+st+').'}
  function raw(m,p,b,tok){var h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
    return fetch(API+p,{method:m,headers:h,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return null}).then(function(j){if(!r.ok){var e=new Error(msg(j,r.status));e.status=r.status;throw e}return j})},function(){throw new Error('Cannot reach the server.')})}
  function setT(t){T=t;sv('wb_tokens',t)}
  function rf(){return T?raw('POST','/auth/refresh',{refresh_token:T.refresh_token}).then(setT):Promise.reject(new Error('Please log in.'))}
  function req(m,p,b){return raw(m,p,b,T&&T.access_token).catch(function(e){if(e.status!==401||!T)throw e;return rf().then(function(){return raw(m,p,b,T.access_token)},function(){setT(null);me=null;throw new Error('Session expired. Please log in again.')})})}
  function pub(){return me&&{name:me.full_name,email:me.email,phone:me.phone,created:me.created_at,settings:me.settings||{}}}
  function loadMe(){return req('GET','/users/me').then(function(u){me=u;return pub()})}
  function tok(t){setT(t);return loadMe()}
  return{needsLogin:true,poll:true,user:pub,
    note:function(){return'Bookings are saved in the database. You get an email with the date and time.'},stor:function(){return''},
    init:function(){return T?loadMe().catch(function(){setT(null)}):Promise.resolve()},
    register:function(d){return raw('POST','/auth/register',{full_name:d.name,email:d.email,phone:d.phone,password:d.password})},
    resend:function(em){return raw('POST','/auth/resend',{email:em})},
    verify:function(em,c){return raw('POST','/auth/verify',{email:em,code:c}).then(tok)},
    login:function(em,pw){return raw('POST','/auth/login',{email:em,password:pw}).then(tok)},
    logout:function(){var t=T;setT(null);me=null;return t?raw('POST','/auth/logout',{refresh_token:t.refresh_token}).catch(function(){}):Promise.resolve()},
    avail:function(d){var p='/seats/availability?date='+d;return(T?req('GET',p):raw('GET',p)).then(function(l){var m={};l.forEach(function(x){if(x.status!=='free')m[x.seat_id]={s:x.status,name:x.booked_by,bid:x.booking_id}});return m})},
    book:function(d,id){return req('POST','/bookings',{seat_id:id,date:d}).then(function(b){return{start:b.start,end:b.end,emailed:!me.settings||me.settings.notify!==false}})},
    cancel:function(d,id,bid){return req('PATCH','/bookings/'+bid+'/cancel')},
    mine:function(){return req('GET','/bookings/me').then(function(l){return l.map(function(b){return{bid:b.id,date:b.date,seat:b.seat_id,label:b.seat_label,start:b.start,end:b.end}})})},
    updateProfile:function(d){return req('PATCH','/users/me',{full_name:d.name,phone:d.phone}).then(function(u){me=u})},
    saveSettings:function(s){return req('PATCH','/users/me',{settings:s}).then(function(u){me=u})}}})();

/* ===== theme ===== */
function applyTheme(t){var r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')}
applyTheme(ld('wb_theme')||'system');
/* ===== navigation ===== */
['eye','filter','info','search','minus','plus'].forEach(function(n){g$('i-'+n).innerHTML=ic(n)});g$('i-help').innerHTML=ic('help',20);
var NAV={desk:'Workplace Booking',user:'Profile',bell:'Notifications',gear:'Settings',chat:'Chat',logout:'Logout'};
var PG={desk:'booking',user:'profile',gear:'settings',bell:'na',chat:'na'},ALLPG=['booking','profile','settings','na'];
function B(n){return '<button data-p="'+n+'" aria-label="'+NAV[n]+'"'+(n==='desk'?' class="on"':'')+'>'+ic(n)+'</button>'}
var sb=g$('sb');
sb.innerHTML='<button>'+ic('chevron',18)+'</button>'+['desk','user','bell','gear'].map(B).join('')+'<span class="sp"></span>'+['chat','logout'].map(B).join('');
g$('na-i').innerHTML=ic('info',44);
function show(p){sb.querySelectorAll('button.on').forEach(function(x){x.classList.remove('on')});var b=sb.querySelector('[data-p="'+p+'"]');if(b)b.classList.add('on');ALLPG.forEach(function(id){g$(id).hidden=id!==PG[p]});g$('title').textContent=NAV[p];g$('na-t').textContent=NAV[p];if(p==='user')renderProfile();if(p==='gear')renderSettings()}
sb.addEventListener('click',function(e){var b=e.target.closest('button[data-p]');if(!b)return;var p=b.dataset.p;if(p==='logout'){store.user()?doLogout():openAuth();return}show(p)});
/* ===== seats, calendar, booking ===== */
var _n=new Date(),TODAY=ymd(_n);if(_n.getHours()>=18)_n.setDate(_n.getDate()+1);
var cur=null,btn=g$('book'),SEL=ymd(_n),AV={},busy=false,pendingBook=false,CY=_n.getFullYear(),CM=_n.getMonth();
var auth=g$('auth'),af=g$('af'),cs=g$('cs'),mode='login',pend=null;
function mark(){document.querySelectorAll('.seat').forEach(function(g){var a=AV[g.dataset.id];g.classList.toggle('mine',!!a&&a.s==='mine');g.classList.toggle('busy',!!a&&a.s==='busy')})}
function upd(){var a=cur&&AV[cur.dataset.id],m=!!a&&a.s==='mine';g$('seatlbl').textContent=cur?' · '+cur.dataset.l:'';g$('hint').textContent=cur?(m?'You booked this seat':'Ready to book'):'Please, select place or another date';btn.disabled=!cur;btn.classList.toggle('on',!!cur);btn.classList.toggle('out',m);btn.textContent=m?'Cancel booking':'Book'}
function refresh(){return store.avail(SEL).then(function(m){AV=m;if(cur&&AV[cur.dataset.id]&&AV[cur.dataset.id].s==='busy'){cur.classList.remove('sel');cur=null}mark();upd()}).catch(function(){})}
function note(m){g$('note').textContent=m||store.note();g$('stor').textContent=store.stor()}
g$('map').addEventListener('click',function(e){var g=e.target.closest('.seat');if(!g)return;var a=AV[g.dataset.id];
  if(a&&a.s==='busy'){g$('hint').textContent='Booked by '+(a.name||'a colleague');return}
  if(cur)cur.classList.remove('sel');if(cur===g){cur=null}else{cur=g;g.classList.add('sel')}upd()});
btn.onclick=function(){if(!cur||busy)return;
  if(store.needsLogin&&!store.user()){pendingBook=true;openAuth();return}
  var id=cur.dataset.id,lb=cur.dataset.l,a=AV[id],mine=!!a&&a.s==='mine';busy=true;
  (mine?store.cancel(SEL,id,a.bid):store.book(SEL,id)).then(function(r){note(mine?'Booking cancelled.':'Booked '+lb+' · '+lng(SEL)+', '+r.start+'–'+r.end+(r.emailed?'. A confirmation email was sent to '+store.user().email+'.':'.'))}).catch(function(e){note(e.message)}).then(function(){busy=false;return refresh()})};
function cal(){var off=(new Date(CY,CM,1).getDay()+6)%7,dim=new Date(CY,CM+1,0).getDate(),h='<div class="ch"><button id="cp" aria-label="Previous month">&lt;</button><span>'+MN[CM]+' '+CY+'</span><button id="cn" aria-label="Next month">&gt;</button></div><div class="cg">'+'MTWTFSS'.split('').map(function(x){return'<div class="dh">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=dim;d++){var k=CY+'-'+p2(CM+1)+'-'+p2(d);h+='<button class="cd'+(k===SEL?' s':'')+(k===TODAY?' t':'')+'" data-d="'+k+'"'+(k<TODAY?' disabled':'')+'>'+d+'</button>'}
  g$('cal').innerHTML=h+'</div>';var q=SEL.split('-');g$('seld').textContent=q[2]+' '+MN[+q[1]-1].slice(0,3)}
g$('cal').addEventListener('click',function(e){var t=e.target;
  if(t.id==='cp'){CM--;if(CM<0){CM=11;CY--}cal()}
  else if(t.id==='cn'){CM++;if(CM>11){CM=0;CY++}cal()}
  else if(t.dataset.d){SEL=t.dataset.d;if(cur){cur.classList.remove('sel');cur=null}cal();refresh();upd()}});
/* ===== login / register ===== */
function err(m){g$('a-err').textContent=m}
function shut(){auth.hidden=true;af.reset();cs.hidden=true;af.hidden=false;pend=null}
function closeAuth(){pendingBook=false;shut()}
function setMode(m){mode=m;document.querySelectorAll('.t').forEach(function(t){t.classList.toggle('on',t.dataset.m===m)});document.querySelectorAll('.reg').forEach(function(x){x.hidden=m!=='reg'});g$('a-go').textContent=m==='reg'?'Continue':'Log in';g$('a-pass').autocomplete=m==='reg'?'new-password':'current-password';err('')}
function openAuth(m){shut();auth.hidden=false;setMode(m||'login');note()}
function setUser(){var u=store.user();g$('who').textContent=u?u.name:'';g$('lg').textContent=u?'Log out':'Log in';if(u&&u.settings&&u.settings.theme){applyTheme(u.settings.theme);sv('wb_theme',u.settings.theme)}}
function afterLogin(){shut();setUser();refresh();if(pendingBook){pendingBook=false;btn.onclick()}}
function doLogout(){store.logout().then(function(){setUser();AV={};refresh();show('desk')})}
function codeUI(r,msg){g$('c-msg').textContent=msg;var d=g$('c-demo');d.hidden=!(r&&r.demoCode);if(r&&r.demoCode)d.innerHTML='Demo: this page has no mail server, so the code is shown here: <b>'+r.demoCode+'</b>';g$('c-code').value='';g$('c-err').textContent=''}
document.querySelectorAll('.t').forEach(function(t){t.onclick=function(){setMode(t.dataset.m)}});
g$('lg').onclick=function(){store.user()?doLogout():openAuth()};
g$('a-x').onclick=closeAuth;g$('c-x').onclick=closeAuth;
auth.addEventListener('click',function(e){if(e.target===auth)closeAuth()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!auth.hidden)closeAuth()});
af.addEventListener('submit',function(e){e.preventDefault();err('');
  var em=v('a-email').trim().toLowerCase(),pw=v('a-pass');
  if(!OL.test(em))return err('Use your Outlook email (outlook, hotmail or live).');
  if(pw.length<6)return err('Password must be at least 6 characters.');
  if(mode==='reg'){
    var nm=v('a-name').trim(),ph=v('a-phone').trim();
    if(nm.length<2)return err('Enter your full name.');
    if(!/^\+?[0-9 ()-]{8,16}$/.test(ph))return err('Enter a valid phone number, e.g. +373 600 00000.');
    if(pw!==v('a-pass2'))return err('Passwords do not match.');
    store.register({name:nm,email:em,phone:ph,password:pw}).then(function(r){pend={em:em};codeUI(r,'We sent a 6-digit code to '+em+'. Your account is created only after you confirm it.');af.hidden=true;cs.hidden=false}).catch(function(x){err(x.message)});
  }else store.login(em,pw).then(afterLogin).catch(function(x){err(x.message)});
});
function v(i){return g$(i).value}
g$('c-re').onclick=function(){if(!pend)return;var em=pend.em;store.resend(em).then(function(r){codeUI(r,'A new code was sent to '+em+'.')}).catch(function(x){g$('c-err').textContent=x.message})};
g$('c-ok').onclick=function(){if(!pend)return;store.verify(pend.em,g$('c-code').value.trim()).then(afterLogin).catch(function(x){g$('c-err').textContent=x.message})};
/* ===== profile ===== */
function initials(n){return n.split(/\s+/).slice(0,2).map(function(w){return w[0]||''}).join('').toUpperCase()}
function renderProfile(){var u=store.user(),el=g$('profile');
  if(!u){el.innerHTML='<div class="nac"><h2>Profile</h2><p>Log in to see your profile and your bookings.</p><br><button class="btn on" id="pl">Log in</button></div>';g$('pl').onclick=function(){openAuth()};return}
  el.innerHTML='<div class="pc"><div class="ph"><div class="av">'+esc(initials(u.name))+'</div><div><h2>'+esc(u.name)+'</h2><p>'+esc(u.email)+'</p></div></div>'+
   '<label class="f">Full name<input id="p-name" value="'+esc(u.name)+'"></label><label class="f">Phone number<input id="p-phone" value="'+esc(u.phone)+'"></label><div class="err" id="p-err"></div><button class="btn on" id="p-save">Save changes</button>'+
   '<h3>Upcoming bookings</h3><div id="bl" class="bl">Loading…</div></div>';
  g$('p-save').onclick=function(){var nm=v('p-name').trim(),ph=v('p-phone').trim(),pe=g$('p-err');if(nm.length<2){pe.textContent='Enter your full name.';return}if(!/^\+?[0-9 ()-]{8,16}$/.test(ph)){pe.textContent='Enter a valid phone number.';return}store.updateProfile({name:nm,phone:ph}).then(function(){setUser();renderProfile()}).catch(function(x){pe.textContent=x.message})};
  store.mine().then(function(l){var b=g$('bl');if(!b)return;if(!l.length){b.textContent='No upcoming bookings.';return}
    b.innerHTML=l.map(function(x,i){return'<div class="br2"><div><b>'+esc(x.label)+'</b><span>'+esc(lng(x.date))+' · '+esc(x.start)+'–'+esc(x.end)+'</span></div><button class="gbtn" data-i="'+i+'">Cancel</button></div>'}).join('');
    b.onclick=function(e){var t=e.target.closest('button[data-i]');if(!t)return;var x=l[+t.dataset.i];store.cancel(x.date,x.seat,x.bid).then(function(){renderProfile();refresh()}).catch(function(){})}})}
/* ===== settings ===== */
function renderSettings(){var u=store.user(),el=g$('settings'),t=(u&&u.settings&&u.settings.theme)||ld('wb_theme')||'system',n=!u||!u.settings||u.settings.notify!==false;
  el.innerHTML='<div class="pc"><h2>Settings</h2>'+
   '<div class="row"><div><b>Theme</b><span>How the site looks</span></div><select id="s-theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>'+
   '<div class="row"><div><b>Email notifications</b><span>'+(u?'Emails with the date and time of your bookings':'Log in to change this')+'</span></div><label class="sw"><input type="checkbox" id="s-mail"'+(n?' checked':'')+(u?'':' disabled')+'><i></i></label></div>'+
   '<div class="row"><div><b>Time zone</b><span>Bookings use office time</span></div><span>Europe/Chisinau</span></div>'+
   '<div class="row"><div><b>Account</b><span>'+(u?esc(u.email):'You are not logged in')+'</span></div><button class="gbtn" id="s-acc">'+(u?'Log out':'Log in')+'</button></div></div>';
  g$('s-theme').value=t;
  g$('s-theme').onchange=function(){var x=this.value;applyTheme(x);sv('wb_theme',x);if(store.user())store.saveSettings({theme:x})};
  g$('s-mail').onchange=function(){store.saveSettings({notify:this.checked})};
  g$('s-acc').onclick=function(){u?doLogout():openAuth()}}
/* ===== start ===== */
cal();setUser();note();mark();upd();refresh();
store.init().then(function(){setUser();note();refresh()});
if(store.onChange)store.onChange(refresh);
if(store.poll)setInterval(refresh,30000);
</script>
</body>
</html>
